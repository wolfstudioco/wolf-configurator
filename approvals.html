<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wolf Studio - Finish Approvals</title>
<style>html,body{margin:0;background:#f3f1ec}@media(prefers-color-scheme:dark){html,body{background:#15120f}}</style>
</head>
<body>
<script>
(function(){
  var SRC="https://pwlsnajjoxhykyxslrej.supabase.co/storage/v1/object/public/approvals/approvals-app.html";
  fetch(SRC+"?t="+Date.now(),{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(function(h){ document.open(); document.write(h); document.close(); })
    .catch(function(e){ document.body.innerHTML='<p style="font-family:monospace;padding:40px;color:#6f685d">Unable to load approvals ('+e.message+'). Refresh to retry.<\/p>'; });
})();
</script>
</body>
</html>
