<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wolf Studio — Finish Approvals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f3f1ec; --surface:#fffdf9; --surface-2:#ece7dd;
    --ink:#1c1916; --muted:#6f685d; --line:#ddd6c9;
    --accent:#977844;
    --ok:#3f7d5b; --ok-bg:#e3efe8; --ok-line:#bcdac8;
    --warn:#b4553a; --warn-bg:#f4e4dd; --warn-line:#e6c4b7;
    --pend:#847e73; --pend-bg:#ece9e1; --pend-line:#d9d3c6;
    --scrim:rgba(14,11,8,.82);
    --font-display:"Archivo",system-ui,sans-serif;
    --font-body:"Archivo",system-ui,sans-serif;
    --font-mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --radius:14px;
    --shadow:0 1px 2px rgba(28,25,22,.05),0 8px 26px rgba(28,25,22,.06);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#15120f; --surface:#201c18; --surface-2:#2a251f;
    --ink:#ece6db; --muted:#a79e90; --line:#37302a;
    --accent:#c7a06a;
    --ok:#74b08d; --ok-bg:#1d2a23; --ok-line:#2f4337;
    --warn:#d4795f; --warn-bg:#2e201b; --warn-line:#45302a;
    --pend:#9b958a; --pend-bg:#26221d; --pend-line:#3a332c;
    --scrim:rgba(0,0,0,.84);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#15120f; --surface:#201c18; --surface-2:#2a251f;
    --ink:#ece6db; --muted:#a79e90; --line:#37302a;
    --accent:#c7a06a;
    --ok:#74b08d; --ok-bg:#1d2a23; --ok-line:#2f4337;
    --warn:#d4795f; --warn-bg:#2e201b; --warn-line:#45302a;
    --pend:#9b958a; --pend-bg:#26221d; --pend-line:#3a332c;
    --scrim:rgba(0,0,0,.84);
    color-scheme:dark;
  }
  *{box-sizing:border-box} html,body{margin:0}
  img{max-width:100%} [hidden]{display:none!important}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.45;-webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .wrap{max-width:1180px;margin:0 auto;padding-left:20px;padding-right:20px;padding-block:0 56px}

  header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:18px 20px 14px;margin-bottom:6px}
  .hbar{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;max-width:1180px;margin:0 auto}
  .brand{display:flex;flex-direction:column;gap:3px;min-width:0}
  .kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500}
  h1{font-family:var(--font-display);font-weight:800;font-size:clamp(20px,3.4vw,27px);letter-spacing:-.01em;margin:0;line-height:1.05}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .meter{min-width:210px;flex:0 1 280px}
  .meter .mrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .meter .mrow b{font-family:var(--font-display);color:var(--ink);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
  .track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
  .fill{height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .5s cubic-bezier(.2,.7,.2,1)}

  .sec{margin-top:30px}
  .sechead{display:flex;align-items:center;gap:12px;margin:0 0 14px}
  .sechead h2{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--ink)}
  .sechead .cnt{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
  .sechead .rule{flex:1;height:1px;background:var(--line)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .card.rev{border-color:var(--warn-line)} .card.ok{border-color:var(--ok-line)}

  .thumb{position:relative;aspect-ratio:4/3;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
  .thumb .fill{position:absolute;left:0;top:0;width:100%;height:100%;background-size:cover;background-position:center;filter:blur(20px) saturate(1) brightness(1.25);transform:scale(1.3);z-index:0;opacity:.45}
  .thumb img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block;transform-origin:center center;transition:transform .1s ease-out}
  .thumb .ph,.thumb .busy,.thumb .replace,.thumb .zoomctl{z-index:2}
  .thumb .ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);text-align:center;padding:16px;cursor:pointer}
  .thumb .ph svg{opacity:.5}
  .thumb .ph span{font-size:11.5px;font-family:var(--font-mono);letter-spacing:.03em}
  .thumb .replace{position:absolute;right:8px;bottom:8px;background:color-mix(in srgb,var(--surface) 86%,transparent);border:1px solid var(--line);color:var(--ink);font-family:var(--font-mono);font-size:10.5px;padding:5px 9px;border-radius:7px;cursor:pointer;backdrop-filter:blur(4px)}
  .thumb .busy,.sw .busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--surface) 72%,transparent);font-family:var(--font-mono);font-size:11px;color:var(--muted)}

  .body{padding:14px 15px 15px;display:flex;flex-direction:column;gap:12px;flex:1}
  .pname{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:-.01em;margin:0;text-wrap:balance}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
  .field{display:flex;flex-direction:column}
  textarea.spec,textarea.notes{display:block;width:100%;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-family:var(--font-mono);font-size:12px;line-height:1.5;resize:vertical}
  textarea.spec{min-height:54px} textarea.notes{min-height:42px}

  .swatches{display:flex;flex-wrap:wrap;gap:9px}
  .sw{position:relative;width:88px;height:88px;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);flex:none}
  .sw img{width:100%;height:100%;object-fit:cover;display:block}
  .sw .cap{position:absolute;left:0;right:0;bottom:0;width:100%;padding:16px 7px 6px;background:linear-gradient(to top,var(--scrim),rgba(0,0,0,0));color:#fff;font-family:var(--font-mono);font-size:9.5px;line-height:1.25;letter-spacing:.02em;text-align:left;word-break:break-word}
  input.cap{appearance:none;border:0;outline:none}
  input.cap::placeholder{color:rgba(255,255,255,.72)}
  .sw .rm{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:99px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:16px;text-align:center;cursor:pointer;display:none;padding:0}
  .sw:hover .rm{display:block}
  .sw.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;border-style:dashed;color:var(--accent)}
  .sw.add span{font-family:var(--font-mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase}
  .sw.add:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}

  .statusrow{display:flex;gap:6px;margin-top:auto;padding-top:3px}
  .seg{flex:1;display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
  .seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font-family:var(--font-display);font-weight:600;font-size:11.5px;letter-spacing:.02em;padding:8px 4px;cursor:pointer;transition:background .12s,color .12s}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"][data-v="pending"]{background:var(--pend-bg);color:var(--pend)}
  .seg button[aria-pressed="true"][data-v="approved"]{background:var(--ok-bg);color:var(--ok)}
  .seg button[aria-pressed="true"][data-v="revise"]{background:var(--warn-bg);color:var(--warn)}

  .empty{grid-column:1/-1;text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:13px;padding:40px 10px;border:1px dashed var(--line);border-radius:var(--radius)}
  .foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:12px;color:var(--muted)}
  .legend{display:flex;gap:14px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11.5px}
  .dot{width:9px;height:9px;border-radius:99px}
  .synced{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
  button:focus-visible,textarea:focus-visible,.sw.add:focus-visible,input.cap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .zoomctl{position:absolute;left:8px;bottom:8px;display:flex;gap:3px;align-items:center;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:9px;padding:3px;backdrop-filter:blur(4px)}
  .zoomctl button{appearance:none;border:0;background:transparent;color:var(--ink);font-family:var(--font-mono);font-size:15px;width:24px;height:24px;border-radius:6px;cursor:pointer;line-height:1}
  .zoomctl button:hover{background:var(--surface-2)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:520px){ .wrap{padding-left:16px;padding-right:16px} header.site{padding-left:16px;padding-right:16px} .meter{flex:1 1 100%} }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <div class="hbar">
      <div class="brand">
        <span class="kicker">Wolf Studio &middot; Shinola Hotel</span>
        <h1>Finish &amp; Furniture Approvals</h1>
        <div class="sub">Renderings and material specifications for final sign-off.</div>
      </div>
      <div class="meter" aria-label="Approval progress">
        <div class="mrow"><span>Approved</span><span><b id="mApproved">0</b> / <b id="mTotal">0</b></span></div>
        <div class="track"><div class="fill" id="mFill"></div></div>
      </div>
    </div>
  </header>

  <div id="sections">
    <div class="empty" id="loading" style="margin-top:28px">Loading finishes&hellip;</div>
  </div>

  <div class="foot">
    <div class="legend">
      <span><i class="dot" style="background:var(--pend)"></i>Pending</span>
      <span><i class="dot" style="background:var(--ok)"></i>Approved</span>
      <span><i class="dot" style="background:var(--warn)"></i>Revise</span>
    </div>
    <span class="synced" id="synced"></span>
  </div>
</div>

<input type="file" id="filepick" accept="image/png,image/jpeg,image/webp,image/avif" hidden>

<script>
(function(){
  "use strict";
  var SUPA_URL="https://pwlsnajjoxhykyxslrej.supabase.co";
  var SUPA_KEY="sb_publishable_pPq6FsUd4G6Pp8uE_G5YhA_FgMfUxdG";
  var REST=SUPA_URL+"/rest/v1/pieces";
  var H={apikey:SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY};
  var HJSON=Object.assign({"Content-Type":"application/json"},H);

  var ICONS={
    photo:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5L5 20"/></svg>',
    plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>'
  };
  var SECTIONS=["Guestrooms","Public Spaces"];
  var cards=new Map(), grids={}, pieces=[], uploadTarget=null;
  var filepick=document.getElementById("filepick");

  function el(t,c,x){var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;}
  function byId(id){ for(var i=0;i<pieces.length;i++) if(pieces[i].id===id) return pieces[i]; return null; }
  function swOf(p){ return Array.isArray(p&&p.swatches)? p.swatches : []; }

  // ---- data layer (Supabase REST + Storage) ----
  function loadPieces(){
    return fetch(REST+"?select=*&order=ord.asc",{headers:H}).then(function(r){ return r.ok?r.json():[]; }).catch(function(){ return null; });
  }
  function patch(id,body){
    return fetch(REST+"?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:Object.assign({"Prefer":"return=minimal"},HJSON),body:JSON.stringify(body)})
      .then(function(r){ if(!r.ok) throw new Error("patch "+r.status); });
  }
  function uploadImage(file){
    var ext=((file.name||"").split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
    var path=Date.now()+"-"+Math.random().toString(36).slice(2,9)+"."+ext;
    return fetch(SUPA_URL+"/storage/v1/object/approvals/"+path,{method:"POST",
      headers:Object.assign({"Content-Type":file.type||"application/octet-stream","x-upsert":"true"},H),body:file})
      .then(function(r){ if(!r.ok) throw new Error("upload "+r.status); return SUPA_URL+"/storage/v1/object/public/approvals/"+path; });
  }

  function ensureSections(){
    var host=document.getElementById("sections");
    var loading=document.getElementById("loading"); if(loading) loading.remove();
    SECTIONS.forEach(function(name){
      if(grids[name]) return;
      var sec=el("section","sec");
      var head=el("div","sechead");
      head.appendChild(el("h2",null,name));
      var cnt=el("span","cnt"); cnt.id="cnt-"+name; head.appendChild(cnt);
      head.appendChild(el("div","rule"));
      var grid=el("div","grid"); grid.id="grid-"+name;
      sec.appendChild(head); sec.appendChild(grid);
      host.appendChild(sec); grids[name]=grid;
    });
  }

  function buildCard(p){
    var root=el("article","card");
    var thumb=el("div","thumb");
    var fill=el("div","fill"); fill.hidden=true;
    var img=el("img"); img.alt=""; img.hidden=true; img.loading="lazy";
    var ph=el("div","ph");
    var busy=el("div","busy","Uploading…"); busy.hidden=true;
    var replace=el("button","replace","Replace"); replace.type="button"; replace.hidden=true;
    var zoomctl=el("div","zoomctl"); zoomctl.hidden=true;
    var zminus=el("button",null,"−"); zminus.type="button"; zminus.title="Item smaller";
    var zplus=el("button",null,"+"); zplus.type="button"; zplus.title="Item larger";
    zoomctl.appendChild(zminus); zoomctl.appendChild(zplus);
    thumb.appendChild(fill); thumb.appendChild(img); thumb.appendChild(ph); thumb.appendChild(busy); thumb.appendChild(replace); thumb.appendChild(zoomctl);

    var body=el("div","body");
    var name=el("h3","pname",p.name||"Untitled piece");

    var specWrap=el("div","field");
    specWrap.appendChild(el("label","lbl","Spec"));
    var specEdit=el("textarea","spec"); specEdit.setAttribute("spellcheck","false");
    specWrap.appendChild(specEdit);

    var swWrap=el("div","field");
    var swLbl=el("label","lbl","Stain & materials"); swWrap.appendChild(swLbl);
    var swRow=el("div","swatches"); swWrap.appendChild(swRow);

    var notesWrap=el("div","field");
    notesWrap.appendChild(el("label","lbl","Notes"));
    var notesEdit=el("textarea","notes"); notesEdit.placeholder="Add a note…"; notesEdit.setAttribute("spellcheck","false");
    notesWrap.appendChild(notesEdit);

    var statusrow=el("div","statusrow");
    var seg=el("div","seg"); var btns={};
    [["pending","Pending"],["approved","Approved"],["revise","Revise"]].forEach(function(pr){
      var b=el("button",null,pr[1]); b.type="button"; b.dataset.v=pr[0];
      b.addEventListener("click",function(){ setStatus(p.id,pr[0]); });
      seg.appendChild(b); btns[pr[0]]=b;
    });
    statusrow.appendChild(seg);

    ph.addEventListener("click",function(){ uploadTarget={id:p.id,mode:"render"}; filepick.click(); });
    zminus.addEventListener("click",function(e){ e.stopPropagation(); setZoom(p.id, curZoom(p.id)/1.2); });
    zplus.addEventListener("click",function(e){ e.stopPropagation(); setZoom(p.id, curZoom(p.id)*1.2); });
    replace.addEventListener("click",function(e){ e.stopPropagation(); uploadTarget={id:p.id,mode:"render"}; filepick.click(); });
    specEdit.addEventListener("blur",function(){ commitField(p.id,"spec",specEdit.value); });
    notesEdit.addEventListener("blur",function(){ commitField(p.id,"notes",notesEdit.value); });

    body.appendChild(name); body.appendChild(specWrap); body.appendChild(swWrap); body.appendChild(notesWrap); body.appendChild(statusrow);
    root.appendChild(thumb); root.appendChild(body);

    return {root:root,fill:fill,img:img,ph:ph,busy:busy,replace:replace,zoomctl:zoomctl,name:name,specEdit:specEdit,notesEdit:notesEdit,swLbl:swLbl,swRow:swRow,seg:seg,btns:btns,lastImg:undefined,lastSw:undefined};
  }

  function renderSwatches(refs,p){
    var arr=swOf(p);
    var sig=JSON.stringify(arr);
    if(refs.swRow.contains(document.activeElement)) return;
    if(sig===refs.lastSw) return;
    refs.lastSw=sig;
    refs.swRow.innerHTML="";
    arr.forEach(function(sw,idx){
      var tile=el("div","sw");
      var im=el("img"); im.alt=""; im.src=sw.url; im.loading="lazy"; tile.appendChild(im);
      var cap=document.createElement("input"); cap.type="text"; cap.className="cap"; cap.value=sw.label||""; cap.placeholder="name…"; cap.setAttribute("spellcheck","false");
      cap.addEventListener("blur",function(){ setSwatchLabel(p.id,idx,cap.value); });
      cap.addEventListener("keydown",function(e){ if(e.key==="Enter") cap.blur(); });
      tile.appendChild(cap);
      var rm=el("button","rm","×"); rm.type="button"; rm.title="Remove swatch";
      rm.addEventListener("click",function(){ removeSwatch(p.id,idx); });
      tile.appendChild(rm);
      refs.swRow.appendChild(tile);
    });
    var add=el("div","sw add"); add.innerHTML=ICONS.plus; add.appendChild(el("span",null,"Add swatch"));
    add.addEventListener("click",function(){ uploadTarget={id:p.id,mode:"swatch"}; filepick.click(); });
    refs.swRow.appendChild(add);
  }

  function updateCard(refs,p){
    if(refs.name.textContent!==(p.name||"")) refs.name.textContent=p.name||"Untitled piece";
    var spec=p.spec||""; if(document.activeElement!==refs.specEdit && refs.specEdit.value!==spec) refs.specEdit.value=spec;
    var notes=p.notes||""; if(document.activeElement!==refs.notesEdit && refs.notesEdit.value!==notes) refs.notesEdit.value=notes;
    var st=(p.status==="approved"||p.status==="revise")?p.status:"pending";
    Object.keys(refs.btns).forEach(function(k){ refs.btns[k].setAttribute("aria-pressed",k===st?"true":"false"); });
    refs.root.classList.toggle("ok",st==="approved"); refs.root.classList.toggle("rev",st==="revise");
    var url=p.image_url||null;
    if(url!==refs.lastImg){ refs.lastImg=url;
      if(url){ refs.img.src=url; refs.img.hidden=false; refs.ph.hidden=true; refs.fill.style.backgroundImage="url('"+url+"')"; refs.fill.hidden=false; }
      else { refs.img.hidden=true; refs.img.removeAttribute("src"); refs.ph.hidden=false; refs.fill.style.backgroundImage=""; refs.fill.hidden=true; } }
    refs.ph.innerHTML=""; if(!url){ refs.ph.innerHTML=ICONS.photo; refs.ph.appendChild(el("span",null,"Add rendering")); }
    refs.replace.hidden=!url;
    var z=(typeof p.image_zoom==="number"&&p.image_zoom>0)?p.image_zoom:1;
    refs.img.style.transform="scale("+z+")";
    refs.zoomctl.hidden=!url;
    renderSwatches(refs,p);
  }

  function render(){
    ensureSections();
    var counts={}; SECTIONS.forEach(function(s){counts[s]=0;});
    var seen=new Set();
    pieces.slice().sort(function(a,b){return (a.ord||0)-(b.ord||0);}).forEach(function(p){
      seen.add(p.id);
      var sec=SECTIONS.indexOf(p.section)>=0?p.section:SECTIONS[0];
      var refs=cards.get(p.id); if(!refs){ refs=buildCard(p); cards.set(p.id,refs); }
      updateCard(refs,p); grids[sec].appendChild(refs.root); counts[sec]++;
    });
    Array.from(cards.keys()).forEach(function(id){ if(!seen.has(id)){ cards.get(id).root.remove(); cards.delete(id);} });
    SECTIONS.forEach(function(s){ var c=document.getElementById("cnt-"+s); if(c) c.textContent=counts[s]+(counts[s]===1?" piece":" pieces"); });
    var total=pieces.length, approved=pieces.filter(function(p){return p.status==="approved";}).length;
    document.getElementById("mApproved").textContent=approved; document.getElementById("mTotal").textContent=total;
    var pct=total?Math.round(approved/total*100):0;
    var fill=document.getElementById("mFill"); fill.style.width=pct+"%"; fill.style.background=(approved===total&&total>0)?"var(--ok)":"var(--accent)";
  }

  // ---- writes (optimistic + persist) ----
  function localSet(id,field,val){ var p=byId(id); if(p){ p[field]=val; } }
  function curZoom(id){ var p=byId(id); var z=p&&p.image_zoom; return (typeof z==="number"&&z>0)?z:1; }
  function setZoom(id,z){ z=Math.max(0.5,Math.min(4,Math.round(z*100)/100)); var p=byId(id); if(!p) return; p.image_zoom=z; var refs=cards.get(id); if(refs){ refs.img.style.transform="scale("+z+")"; } patch(id,{image_zoom:z}).then(markSynced).catch(flagErr); }
  function setStatus(id,v){ var p=byId(id); if(!p||p.status===v) return; localSet(id,"status",v); render(); patch(id,{status:v}).then(markSynced).catch(flagErr); }
  function commitField(id,field,val){ var p=byId(id); if(!p||(p[field]||"")===val) return; localSet(id,field,val); var b={}; b[field]=val; patch(id,b).then(markSynced).catch(flagErr); }
  function setSwatchLabel(id,idx,label){ var p=byId(id); var arr=swOf(p).slice(); if(!arr[idx]||(arr[idx].label||"")===label) return; arr[idx]={url:arr[idx].url,label:label}; localSet(id,"swatches",arr); patch(id,{swatches:arr}).then(markSynced).catch(flagErr); }
  function removeSwatch(id,idx){ var p=byId(id); var arr=swOf(p).slice(); if(!arr[idx]) return; arr.splice(idx,1); localSet(id,"swatches",arr); render(); patch(id,{swatches:arr}).then(markSynced).catch(flagErr); }

  filepick.addEventListener("change",function(){
    var f=filepick.files&&filepick.files[0]; var tgt=uploadTarget; uploadTarget=null; filepick.value="";
    if(!f||!tgt) return;
    var refs=cards.get(tgt.id);
    if(tgt.mode==="render" && refs){ refs.busy.hidden=false; }
    uploadImage(f).then(function(url){
      if(tgt.mode==="swatch"){
        var p=byId(tgt.id); var arr=swOf(p).slice(); arr.push({url:url,label:""}); localSet(tgt.id,"swatches",arr); render();
        return patch(tgt.id,{swatches:arr});
      } else {
        localSet(tgt.id,"image_url",url); render();
        return patch(tgt.id,{image_url:url});
      }
    }).then(function(){ if(refs) refs.busy.hidden=true; markSynced(); })
      .catch(function(e){ if(refs) refs.busy.hidden=true; flagErr(e); });
  });

  // ---- sync ----
  function markSynced(){ var s=document.getElementById("synced"); if(s){ var d=new Date(); s.textContent="Saved "+d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); } }
  function flagErr(){ var s=document.getElementById("synced"); if(s){ s.textContent="Couldn’t save — check your connection"; } }
  function refresh(){ loadPieces().then(function(rows){ if(!rows) return; pieces=rows; render(); }); }

  // ---- boot ----
  loadPieces().then(function(rows){
    if(rows===null){ document.getElementById("sections").innerHTML='<div class="empty" style="margin-top:28px">Couldn’t load. Check your connection and reload.</div>'; return; }
    pieces=rows; ensureSections(); render();
    setInterval(refresh,20000);
    window.addEventListener("focus",refresh);
  });
})();
</script>
</body>
</html>
